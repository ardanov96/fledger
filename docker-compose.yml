# ==============================================================================
# FLEDGER OS — Master Microservices Docker Compose
# The Ledger-First Operating System for Distribution, Fleet Logistics & Supply Chain
#
# Quick Start:
#   docker compose up -d                  # Start entire ecosystem (infra + 6 services + gateway)
#   docker compose up -d postgres redis nats # Start infrastructure only (for host dev)
#   docker compose ps                     # Check running containers
#   docker compose logs -f                # Tail logs
#   docker compose down                   # Graceful shutdown
# ==============================================================================

name: fledger-os

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  fledger_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Multi-Database Cluster for 6 Microservices)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fmcg_wallet
      POSTGRES_USER: fmcg
      POSTGRES_PASSWORD: fmcg_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - ./fledger-core/migrations:/docker-entrypoint-initdb.d/schemas/core:ro
      - ./fledger-fleet/src/migrations:/docker-entrypoint-initdb.d/schemas/fleet:ro
      - ./fledger-pay/src/migrations:/docker-entrypoint-initdb.d/schemas/pay:ro
      - ./fledger-force/src/migrations:/docker-entrypoint-initdb.d/schemas/force:ro
      - ./fledger-order/src/migrations:/docker-entrypoint-initdb.d/schemas/order:ro
      - ./fledger-dunning/docs/DATABASE-SCHEMA.sql:/docker-entrypoint-initdb.d/schemas/dunning/000001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmcg -d fmcg_wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 1024m

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Caching, Token Bucket Rate-Limiting & Idempotency Locks)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fledger_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 256m

  # ----------------------------------------------------------------------------
  # 3. NATS JetStream (Asynchronous Event-Driven Messaging Backbone)
  # ----------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: fledger_nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring dashboard
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 256m

  # ----------------------------------------------------------------------------
  # 4. Fledger Core (:8081) — Financial Ledger & Settlement Engine
  # ----------------------------------------------------------------------------
  core:
    build:
      context: ./fledger-core
      dockerfile: Dockerfile
    container_name: fledger_core
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8081
      DATABASE_URL: postgres://fmcg:fmcg_dev_password@postgres:5432/fmcg_wallet?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: fledger-super-secure-jwt-secret-key-2026-min-32
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 512m

  # ----------------------------------------------------------------------------
  # 5. Fledger Fleet (:8082) — Fleet Logistics, Trip Dispatch & Proof of Delivery
  # ----------------------------------------------------------------------------
  fleet:
    build:
      context: ./fledger-fleet
      dockerfile: Dockerfile
    container_name: fledger_fleet
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8082
      DATABASE_URL: postgres://fmcg:fmcg_dev_password@postgres:5432/fledger_fleet?sslmode=disable
      FLEDGER_CORE_URL: http://core:8081
      FLEDGER_TENANT_ID: a0000000-0000-0000-0000-000000000001
      JWT_SECRET: fledger-super-secure-jwt-secret-key-2026-min-32
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 512m

  # ----------------------------------------------------------------------------
  # 6. Fledger Pay (:8083) — B2B Payment Gateway & Auto-Settlement Engine
  # ----------------------------------------------------------------------------
  pay:
    build:
      context: ./fledger-pay
      dockerfile: Dockerfile
    container_name: fledger_pay
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8083
      DATABASE_URL: postgres://fmcg:fmcg_dev_password@postgres:5432/fledger_pay?sslmode=disable
      FLEDGER_CORE_URL: http://core:8081
      FLEDGER_DUNNING_URL: http://dunning:8086
      FLEDGER_TENANT_ID: a0000000-0000-0000-0000-000000000001
      JWT_SECRET: fledger-super-secure-jwt-secret-key-2026-min-32
      WEBHOOK_SECRET: dunning-super-secret-key-2026
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 512m

  # ----------------------------------------------------------------------------
  # 7. Fledger Force (:8084) — Sales Force Automation (SFA) & Anti-Cash Kitting
  # ----------------------------------------------------------------------------
  force:
    build:
      context: ./fledger-force
      dockerfile: Dockerfile
    container_name: fledger_force
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8084
      DATABASE_URL: postgres://fmcg:fmcg_dev_password@postgres:5432/fledger_force?sslmode=disable
      FLEDGER_CORE_URL: http://core:8081
      FLEDGER_TENANT_ID: a0000000-0000-0000-0000-000000000001
      JWT_SECRET: fledger-super-secure-jwt-secret-key-2026-min-32
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 512m

  # ----------------------------------------------------------------------------
  # 8. Fledger Order (:8085) — B2B OMS, Wholesale Tiers & Hard Credit Gate
  # ----------------------------------------------------------------------------
  order:
    build:
      context: ./fledger-order
      dockerfile: Dockerfile
    container_name: fledger_order
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8085
      DATABASE_URL: postgres://fmcg:fmcg_dev_password@postgres:5432/fledger_order?sslmode=disable
      FLEDGER_CORE_URL: http://core:8081
      FLEDGER_FLEET_URL: http://fleet:8082
      FLEDGER_TENANT_ID: a0000000-0000-0000-0000-000000000001
      JWT_SECRET: fledger-super-secure-jwt-secret-key-2026-min-32
      MANAGER_OVERRIDE_PIN: "123456"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 512m

  # ----------------------------------------------------------------------------
  # 9. Fledger Dunning (:8086) — AR Dunning Cadence & WhatsApp Engine
  # ----------------------------------------------------------------------------
  dunning:
    build:
      context: ./fledger-dunning
      dockerfile: Dockerfile
    container_name: fledger_dunning
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: 8086
      DATABASE_URL: postgres://fmcg:fmcg_dev_password@postgres:5432/fledger_dunning?sslmode=disable
      FLEDGER_CORE_URL: http://core:8081
      FLEDGER_PAY_URL: http://pay:8083
      FLEDGER_TENANT_ID: a0000000-0000-0000-0000-000000000001
      JWT_SECRET: fledger-super-secure-jwt-secret-key-2026-min-32
      PAY_WEBHOOK_SECRET: dunning-super-secret-key-2026
      WA_PROVIDER: MOCK
      WA_JITTER_MIN_SECONDS: 1
      WA_JITTER_MAX_SECONDS: 3
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 512m

  # ----------------------------------------------------------------------------
  # 10. Unified API Gateway (:80) — Reverse Proxy & Ecosystem Control Plane
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: fledger_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployments/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/gateway/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - core
      - fleet
      - pay
      - force
      - order
      - dunning
    networks:
      - fledger_net
    logging: *default-logging
    mem_limit: 128m
