# =============================================================================
# Promtail configuration — ships Docker container logs to Loki
# =============================================================================

server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["fmcg-wallet"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
        regex: /(.*)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_compose_project"]
        target_label: project
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{service="fmcg-wallet-api"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  time: time
            - labels:
                level:

  # Standalone API logs (when running natively, not in Docker)
  - job_name: api-native
    static_configs:
      - targets:
          - localhost
        labels:
          job: fmcg-wallet-api-native
          __path__: /var/log/fmcg-wallet/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            request_id: request_id
      - labels:
          level:
