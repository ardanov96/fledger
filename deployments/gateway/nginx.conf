events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams for all 6 Fledger OS microservices
    upstream core_service {
        server core:8081;
    }
    upstream fleet_service {
        server fleet:8082;
    }
    upstream pay_service {
        server pay:8083;
    }
    upstream force_service {
        server force:8084;
    }
    upstream order_service {
        server order:8085;
    }
    upstream dunning_service {
        server dunning:8086;
    }

    server {
        listen 80;
        server_name localhost;

        # Central Gateway Healthcheck
        location /healthz {
            default_type application/json;
            return 200 '{"status":"alive","gateway":"fledger-api-gateway","version":"1.0.0"}';
        }

        # Unified Gateway Hub / Landing Page & Clean HTML Routes (/hub, /demo, /simulator)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ $uri.html =404;
        }

        # --- Microservices Reverse Proxy & UI Redirects ---

        # 1. Fledger Core (:8081)
        location = /core {
            return 302 /core/web/;
        }
        location = /core/ {
            return 302 /core/web/;
        }
        location /core/ {
            proxy_pass http://core_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /v1/core/ {
            proxy_pass http://core_service/v1/core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Fledger Fleet (:8082)
        location = /fleet { return 302 /fleet/; }
        location /fleet/ {
            proxy_pass http://fleet_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /v1/fleet/ {
            proxy_pass http://fleet_service/v1/fleet/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Fledger Pay (:8083)
        location = /pay { return 302 /pay/; }
        location /pay/ {
            proxy_pass http://pay_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /v1/pay/ {
            proxy_pass http://pay_service/v1/pay/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Fledger Force (:8084)
        location = /force { return 302 /force/; }
        location /force/ {
            proxy_pass http://force_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /v1/force/ {
            proxy_pass http://force_service/v1/force/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Fledger Order (:8085)
        location = /order { return 302 /order/; }
        location /order/ {
            proxy_pass http://order_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /v1/order/ {
            proxy_pass http://order_service/v1/order/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. Fledger Dunning (:8086)
        location = /dunning { return 302 /dunning/; }
        location /dunning/ {
            proxy_pass http://dunning_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /v1/dunning/ {
            proxy_pass http://dunning_service/v1/dunning/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
