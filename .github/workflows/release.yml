# GitHub Actions: Tagged release builds + multi-arch Docker image push.
#
# Triggered on git tag (v*). Builds:
#   1. Binaries (api, worker, migrator) for linux/amd64 + linux/arm64
#   2. Multi-arch Docker image (push ke GHCR)
#   3. GitHub Release with binaries attached
#
# Required secrets:
#   - GITHUB_TOKEN (auto-provided)
# Container registry: ghcr.io/runut/fmcg-wallet

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create release + push to gh-pages
  packages: write   # push image to GHCR
  id-token: write   # optional, for cosign signing later

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Resolve short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p bin
          # Build with version ldflags for runtime.version reporting.
          LDFLAGS="-s -w -X main.version=${VERSION#v}"
          for cmd in api worker migrator; do
            echo "Building ${cmd} for ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 go build -trimpath -ldflags="${LDFLAGS}" \
              -o "bin/${cmd}-${GOOS}-${GOARCH}${matrix.ext}" \
              "./cmd/${cmd}"
          done

      - name: Generate SHA256SUMS
        run: sha256sum bin/* > bin/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmcg-wallet-binaries-${{ matrix.target }}
          path: bin/
          if-no-files-found: error

  build-image:
    name: Build & Push Docker Image (multi-arch)
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/runut/fmcg-wallet
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=fmcg-wallet
            org.opencontainers.image.description=Production-grade FMCG/F&B hybrid wallet backend
            org.opencontainers.image.source=https://github.com/runut/fmcg-wallet

      - name: Build & push multi-arch
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-image]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fmcg-wallet-binaries-*
          path: dist/
          merge-multiple: true

      - name: Show artifacts
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/**
          body: |
            ## ${{ github.ref_name }}

            Production-grade FMCG/F&B hybrid wallet backend.

            ### Installation
            ```bash
            # Pull multi-arch image
            docker pull ghcr.io/runut/fmcg-wallet:${{ github.ref_name }}

            # Or download standalone binaries
            # (see assets below)
            ```

            ### What's changed
            See [auto-generated release notes](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            Full changelog: [SPRINTS.md](https://github.com/runut/fmcg-wallet/blob/${{ github.ref_name }}/docs/SPRINTS.md)
