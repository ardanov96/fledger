# GitHub Actions: MkDocs documentation deployment to GitHub Pages.
#
# Auto-builds docs on every push to main + on PR (with strict link check).
# Resulting site is hosted at https://runut.github.io/fmcg-wallet/

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

# Allow only one concurrent deployment, queueing newer runs.
concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: write  # needed to deploy to gh-pages branch
  pull-requests: read

jobs:
  build:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    # Only deploy on main branch pushes; PR runs are build-only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision-date-localized plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache MkDocs plugins
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mkdocs-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-

      - name: Install MkDocs + Material theme
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-material-extensions \
            pymdown-extensions

      - name: Build site (strict link check)
        run: |
          # warn_on_missing_docs=true in mkdocs.yml already catches typos.
          # We additionally check for broken internal anchors.
          mkdocs build --strict --clean

      - name: Verify build output exists
        run: |
          test -d site || (echo "::error::site directory missing" && exit 1)
          test -f site/index.html || (echo "::error::site/index.html missing" && exit 1)
          echo "Site built successfully at $(realpath site)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Docs deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

  check-pr:
    name: Check Docs (PR only)
    runs-on: ubuntu-latest
    # PR runs only check build (no deploy); main pushes deploy via build job.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions
      - name: MkDocs strict build
        run: mkdocs build --strict --clean
      - name: Annotate PR with broken links
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ MkDocs build failed. Run `mkdocs build --strict` locally to see the broken links.'
            })
