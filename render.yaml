# ==============================================================================
# FLEDGER OS — Render Blueprint (Zero-Config 1-Click Deployment)
# 100% Free Plan, No Credit Card Required
# ==============================================================================
services:
  - type: web
    name: fledger-os
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
