<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <!-- Outer Shield / Vault Hexagon Ring -->
    <path d="M256 64 L416 144 L416 320 L256 432 L96 320 L96 144 Z" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Central SFA Navigation Arrow -->
    <path d="M256 128 L368 352 L256 304 L144 352 Z" fill="url(#accentGrad)"/>
    
    <!-- Internal Lock Indicator -->
    <circle cx="256" cy="240" r="28" fill="#ffffff"/>
    <path d="M246 240 L266 240 L262 268 L250 268 Z" fill="#0f172a"/>
  </g>
</svg>
