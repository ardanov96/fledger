<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#051438" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle Frame (Modern PWA Icon Specification) -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBg)"/>
  
  <!-- Subtle Inner Specular Border -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="4"/>

  <!-- Kinetic 'F' Monogram with 3D Depth Shadow -->
  <g filter="url(#pillShadow)">
    <!-- Vertical Anchor Spine -->
    <rect x="116" y="116" width="72" height="280" rx="36" fill="#ffffff"/>
    <!-- Upper Ledger Bar (Forward Velocity) -->
    <rect x="228" y="116" width="168" height="72" rx="36" fill="#38bdf8"/>
    <!-- Middle Balance Bar (Reconciliation Integrity) -->
    <rect x="228" y="224" width="112" height="72" rx="36" fill="#34d399"/>
  </g>
</svg>
