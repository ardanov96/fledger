# =============================================================================
# Grafana datasource provisioning
# Auto-configures Prometheus, Loki, and Tempo on Grafana startup.
# =============================================================================

apiVersion: 1

datasources:
  # Sprint 59: Alertmanager datasource for unified alerting.
  # Grafana reads firing alerts from Alertmanager and shows them as
  # dashboard annotations + in the Alerting UI.
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: true
    jsonData:
      handleGrafanaManagedAlerts: false
      implementation: prometheus

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasource: Loki
        tags: ["job", "instance", "pod", "service"]
        mappedTags: [{ key: "service.name", value: "service" }]
        mapTagNamesEnabled: true
      serviceMap:
        datasource: Prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      spanBar:
        type: "Tag"
      traceQuery:
        query: /api/traces/{traceId}
