# Casbin RBAC-with-domains model for FMCG Wallet.
#
# Request definition: sub = user_id, dom = tenant_id, obj = resource,
# act = action.
#
# Policy rules: p, <role>, <domain>, <obj>, <act>
#   meaning "role may perform act on obj within domain".
#
# Role assignments: g, <user>, <role>, <domain>
#   meaning "user has role within domain".
[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
